# A throwaway Postgres for local work, and the one an agent's task VM runs
# against so a migration can be genuinely destructive without touching Supabase.
services:
  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadence
    ports:
      # Host port is overridable so a machine already using 5433 can still run
      # this; the container side stays 5432 and the default stays 5433.
      - "${CADENCE_DB_PORT:-5433}:5432"
